name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: |
          mkdir -p reports
          pnpm security:audit > reports/dependency-audit.raw.json
        shell: bash
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium chrome
      - if: runner.os == 'Linux'
        run: pnpm test:e2e
      - if: runner.os == 'Linux'
        run: python scripts/check-site-zip.py test-results/ordinary/site.zip
      - if: runner.os == 'Linux'
        run: pnpm test:webmcp
      - if: runner.os == 'Windows'
        run: pnpm exec playwright install chrome
      - if: runner.os == 'Windows'
        run: pnpm package:source
      - if: runner.os == 'Windows'
        name: Build Windows x64 portable
        shell: pwsh
        run: |
          $env:PROTEST_GH_PATH = (Get-Command gh.exe).Source
          pnpm package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        run: python scripts/unpack-release.py --out ../protest-source-consumer
      - if: runner.os == 'Windows'
        run: pnpm --dir ../protest-source-consumer install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: pnpm --dir ../protest-source-consumer check
      - if: runner.os == 'Windows'
        run: pnpm --dir ../protest-source-consumer build
      - if: runner.os == 'Windows'
        run: pnpm --dir ../protest-source-consumer test:webmcp
      - if: runner.os == 'Windows'
        run: python scripts/unpack-portable.py --out ../protest-portable-consumer
      - if: runner.os == 'Windows'
        run: pnpm test:portable
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protest-release
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ runner.os }}
          path: |
            test-results/
            reports/dependency-audit.raw.json
            ${{ runner.workspace }}/protest-source-consumer/test-results/
          retention-days: 7
          overwrite: true
  artifact-transfer:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download release artifacts (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download release artifacts (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-release
          path: release-artifacts
      - name: Verify transferred checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS
      - name: Exercise release guard with in-memory clients
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { verifyActionCompatibility } = await import(process.env.GITHUB_WORKSPACE + '/scripts/test-action-compat.mjs');
            await verifyActionCompatibility();
  artifact-missing-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-nonexistent-transfer-guard
      - name: Reject an unexpected missing-artifact result
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    needs: [check, artifact-transfer, artifact-missing-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download release artifacts (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download release artifacts (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download release artifacts (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protest-release
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });

